<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デートガチャ - おでかけ日和</title>
<meta name="description" content="いる場所・気分・天気・時間帯を選ぶと、近くのデートスポットと次に寄る場所を提案します。全国どこでも使えます">
<meta name="theme-color" content="#F6F7F2">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おでかけ日和">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="sub-header">
  <div class="wrap">
    <a class="back" href="./">← トップ</a>
    <h1 class="sub-title">デートガチャ</h1>
    <span class="sub-logo">おでかけ日和</span>
  </div>
</header>

<main class="wrap gacha-main">
  <div class="gacha-panel">
    <div id="locbar" class="locbar-compact"></div>
    <fieldset class="field"><legend>範囲</legend><div class="seg" id="g-radius"></div></fieldset>
    <fieldset class="field"><legend>気分</legend><div class="seg" id="g-tag"></div></fieldset>
    <fieldset class="field"><legend>天気</legend><div class="seg" id="g-weather"></div></fieldset>
    <fieldset class="field"><legend>時間帯</legend><div class="seg" id="g-when"></div></fieldset>
    <fieldset class="field"><legend>知名度</legend><div class="seg" id="g-fame"></div></fieldset>

    <div class="machine" id="machine" aria-hidden="true">
      <div class="machine-dome" id="dome"></div>
      <div class="machine-body"><span class="knob"></span></div>
    </div>
    <button type="button" class="spin-btn" id="spin" disabled>ガチャを回す</button>
    <p class="pool-note" id="pool-note"></p>
  </div>

  <section class="result" id="result" aria-live="polite">
    <div class="result-placeholder">
      <b>まだ回していません</b>
      条件を選んで回すと、行き先と、そのあと寄れる近くの場所が出ます。
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>個人が趣味で作っている非公式サイトです。営業時間や料金は変わることがあるので、行く前に公式サイトで確認してください。</p>
    <p>地図データ <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>、説明と写真 Wikipedia、位置検索 国土地理院</p>
  </div>
</footer>

<script src="assets/common.js"></script>
<script src="assets/gacha.js"></script>
</body>
</html>
