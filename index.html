<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おでかけ日和 - 全国のデート・おでかけスポット</title>
<meta name="description" content="いる場所のまわりの夜景、絶景、水族館、美術館、歴史スポットを地図データから探して提案。全国のおでかけニュースも6時間ごとに自動でまとめる非公式サイト">
<meta name="theme-color" content="#F6F7F2">
<meta property="og:title" content="おでかけ日和">
<meta property="og:description" content="全国どこでも、近くのデート＆観光スポットを探せるサイト">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おでかけ日和">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <h1 class="logo"><a href="./">おでかけ日和</a></h1>
    <p class="tagline">全国のデート・おでかけスポット</p>
  </div>
</header>

<main class="wrap main">
  <div id="locbar"></div>

  <nav class="entries" aria-label="ほかのページ">
    <a class="entry" href="gacha.html">
      <span class="entry-machine" aria-hidden="true"><i style="--c:#C2364F"></i><i style="--c:#34418F"></i><i style="--c:#3D7A3A"></i></span>
      <span class="entry-text"><b>デートガチャ</b><span>迷ったら、行き先を1つ決めてもらう</span></span>
    </a>
    <a class="entry" href="map.html">
      <span class="entry-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>
      <span class="entry-text"><b>地図で見る</b><span>動かした先でも探せます</span></span>
    </a>
  </nav>

  <section class="season" id="season" aria-labelledby="season-heading" hidden>
    <div class="sec-head">
      <h2 id="season-heading"><span id="season-title">いまが見頃</span></h2>
    </div>
    <div class="season-row" id="season-row"></div>
  </section>

  <section aria-labelledby="spots-heading">
    <div class="sec-head">
      <h2 id="spots-heading">近くのスポット</h2>
      <span class="sec-sub" id="spots-sub"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="気分"></nav>

    <div class="tools">
      <form class="search" id="search-form" role="search">
        <label class="visually-hidden" for="q">スポット名で絞り込む</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="絞り込む（水族館、城など）" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="tool-row">
        <div class="areas" id="radius" role="group" aria-label="範囲"></div>
        <div class="areas" id="sort" role="group" aria-label="並び順"></div>
        <button type="button" class="saved-toggle" id="saved-toggle" aria-pressed="false"><span>行きたい</span> <span class="saved-count" id="saved-count">0</span></button>
      </div>
    </div>

    <p class="result-note" id="result-note"></p>
    <div class="grid" id="grid"></div>
    <button type="button" class="more" id="more" hidden>もっと見る</button>
  </section>

  <section class="news" aria-labelledby="news-heading">
    <div class="sec-head">
      <h2 id="news-heading">おでかけニュース</h2>
      <span class="sec-sub" id="news-updated"></span>
    </div>
    <div class="news-filter" id="news-scope" role="group" aria-label="地域"></div>
    <div class="news-filter" id="news-filter" role="group" aria-label="ニュースの種類"></div>
    <p class="status" id="news-status">ニュースを読み込み中…</p>
    <ul class="news-list" id="news-list"></ul>
    <button type="button" class="more" id="news-more" hidden>もっと見る</button>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>個人が趣味で作っている非公式サイトです。営業時間や料金は変わることがあるので、行く前に公式サイトで確認してください。</p>
    <p>地図データ <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>、説明と写真 Wikipedia、位置検索 国土地理院。ニュースは見出しだけを載せ、各記事の出典元にリンクしています。</p>
  </div>
</footer>

<script src="assets/common.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
