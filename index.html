<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おでかけ日和</title>
<meta name="description" content="ふたりで行きたい場所を、近くから探す。全国どこでも、いまいる場所のまわりのデートスポットをまとめて見られます">
<meta name="theme-color" content="#FDFCF6">
<meta property="og:title" content="おでかけ日和">
<meta property="og:description" content="ふたりで行きたい場所、近くから探す。">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おでかけ日和">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="wrap top">
  <h1 class="logo"><a href="./">おでかけ日和</a></h1>
  <p class="tagline">ふたりで行きたい場所、近くから探す。</p>
  <nav class="top-links" aria-label="ほかのページ">
    <a href="gacha.html">迷ったらガチャ</a>
    <a href="map.html">地図で見る</a>
  </nav>
</header>

<main class="wrap main">
  <div id="locbar" class="where"></div>

  <section class="season" id="season" aria-labelledby="season-title" hidden>
    <h2 class="hand-h" id="season-title">いまが見頃</h2>
    <div class="season-row" id="season-row"></div>
  </section>

  <section aria-labelledby="spots-heading">
    <div class="sec-head">
      <h2 class="hand-h" id="spots-heading">近くのスポット</h2>
      <span class="sec-sub" id="spots-sub"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="気分"></nav>
    <div class="tools">
      <form class="search" id="search-form" role="search">
        <label class="visually-hidden" for="q">しぼりこむ</label>
        <input type="search" id="q" placeholder="しぼりこむ（水族館、城など）" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="tool-row">
        <div class="areas" id="radius" role="group" aria-label="範囲"></div>
        <div class="areas" id="sort" role="group" aria-label="並び順"></div>
        <button type="button" class="saved-toggle" id="saved-toggle" aria-pressed="false"><span>行きたい</span> <span class="saved-count" id="saved-count">0</span></button>
      </div>
    </div>
    <p class="result-note" id="result-note"></p>
    <div class="grid" id="grid"></div>
    <button type="button" class="more" id="more" hidden>もっと見る</button>
  </section>

  <section class="news" aria-labelledby="news-heading">
    <div class="sec-head">
      <h2 class="hand-h" id="news-heading">おでかけニュース</h2>
      <span class="sec-sub" id="news-updated"></span>
    </div>
    <div class="tabs" id="news-scope" role="group" aria-label="地域"></div>
    <div class="tabs tabs-sub" id="news-filter" role="group" aria-label="ニュースの種類"></div>
    <p class="status" id="news-status">読み込み中…</p>
    <ul class="news-list" id="news-list"></ul>
    <button type="button" class="more" id="news-more" hidden>もっと見る</button>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>個人が趣味で作っている非公式サイトです。営業時間や料金は変わることがあるので、行く前に公式サイトで確認してください。</p>
    <p>地図データ <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>、説明と写真 Wikipedia、位置検索 国土地理院。ニュースは見出しだけを載せ、出典元にリンクしています。</p>
  </div>
</footer>

<script src="assets/common.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
