<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おでかけ日和</title>
<meta name="description" content="いまいる場所と気分を答えると、近くのデートスポットを1つずつ教えてくれるサイト。全国どこでも使えます">
<meta name="theme-color" content="#FDFCF6">
<meta property="og:title" content="おでかけ日和">
<meta property="og:description" content="いまいる場所と気分から、近くのデートスポットを探す">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おでかけ日和">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <h1 class="logo"><a href="./">おでかけ日和</a></h1>
    <nav class="header-links" aria-label="ほかのページ">
      <a href="#saved">行きたい <span id="saved-count">0</span></a>
      <a href="map.html">地図</a>
      <a href="gacha.html">ガチャ</a>
    </nav>
  </div>
</header>

<main class="wrap main">
  <section class="chat" aria-label="日和との会話">
    <div class="log" id="chat" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </section>

  <section class="notebook" id="saved" aria-labelledby="saved-heading">
    <h2 id="saved-heading"><span>行きたいリスト</span></h2>
    <ul class="memo-list" id="saved-list"></ul>
  </section>

  <section class="notebook" aria-labelledby="news-heading">
    <h2 id="news-heading"><span>おでかけニュース</span></h2>
    <p class="note" id="news-updated"></p>
    <div class="tabs" id="news-scope" role="group" aria-label="地域"></div>
    <div class="tabs tabs-sub" id="news-filter" role="group" aria-label="ニュースの種類"></div>
    <p class="note" id="news-status">読み込み中…</p>
    <ul class="news-list" id="news-list"></ul>
    <button type="button" class="more" id="news-more" hidden>もっと見る</button>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>個人が趣味で作っている非公式サイトです。営業時間や料金は変わることがあるので、行く前に公式サイトで確認してください。</p>
    <p>地図データ <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>、説明と写真 Wikipedia、位置検索 国土地理院。ニュースは見出しだけを載せ、出典元にリンクしています。</p>
  </div>
</footer>

<script src="assets/common.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
